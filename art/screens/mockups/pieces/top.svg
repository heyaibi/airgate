<svg xmlns="http://www.w3.org/2000/svg" width="1116" height="76" viewBox="0 0 1116 76">
  <!-- opaque top bezel, rounded top corners only; solid body colour matching all
       other pieces. Width equals the assembled body width (sw + 2*SIDE) so the
       strip is never cropped: cropping the right side would cut the right corner
       arc and make it look square. 6px taller than the visible bezel so its
       bottom 6px sits behind the screenshot and shows through the corner cutouts. -->
  <path d="M 56 0 H 1060 A 56 56 0 0 1 1116 56 V 76 H 0 V 56 A 56 56 0 0 1 56 0 Z" fill="#1c1c1c"/>
</svg>
