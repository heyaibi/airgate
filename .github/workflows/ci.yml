name: CI

on:
  push:
    branches: [master]
    paths:
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'settings-gradle.lockfile'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'app/build.gradle.kts'
      - 'app/gradle.lockfile'
      - 'app/src/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'settings-gradle.lockfile'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'app/build.gradle.kts'
      - 'app/gradle.lockfile'
      - 'app/src/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests · lint · build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" --install "platform-tools" >/dev/null
          "$SDKMAN" --channel=3 --install "platforms;android-37.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :buildSrc:test :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Assemble release APK
        run: |
          keytool -genkeypair -v -alias ci -keyalg RSA -keysize 2048 -validity 3650 \
            -keystore "$RUNNER_TEMP/ci-release.p12" -storetype PKCS12 \
            -storepass changeit -keypass changeit -dname "CN=CI,O=Airgate,C=US" >/dev/null 2>&1
          ./gradlew :app:assembleRelease \
            -PAG_RELEASE_STORE_FILE="$RUNNER_TEMP/ci-release.p12" \
            -PAG_RELEASE_STORE_PASSWORD=changeit \
            -PAG_RELEASE_KEY_ALIAS=ci \
            -PAG_RELEASE_KEY_PASSWORD=changeit

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" --install "platform-tools" >/dev/null
          "$SDKMAN" --channel=3 --install "platforms;android-37.0" >/dev/null
          for i in 1 2 3; do
            if "$SDKMAN" --install "emulator" "system-images;android-35;default;x86_64" >/dev/null 2>&1; then
              break
            fi
            echo "system image install failed (attempt $i/3); clearing sdkmanager temp and retrying..."
            rm -rf "$ANDROID_HOME/.temp"
            sleep 10
          done

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-35

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64
