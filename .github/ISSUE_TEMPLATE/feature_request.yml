name: Feature request
description: Suggest an idea for Airgate
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Other approaches you tried or considered.
  - type: textarea
    id: security
    attributes:
      label: Security consideration
      description: Does this feature touch PIN handling, persistence, or the network? If so, how does it preserve the offline, zero-network threat model from CONTRIBUTING.md?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — screenshots, links, sketches.
